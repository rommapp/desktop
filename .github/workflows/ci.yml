name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The Electron binary is a ~230MB download and nothing here runs the app,
      # so CI only needs the package's types and test dependencies.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Build
        run: npm run build
