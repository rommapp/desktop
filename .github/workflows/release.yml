name: Release

on:
  push:
    tags: ["v*"]
  # Build the installers without releasing them, to check packaging changes.
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder fetches the Electron distributions it packages, so the
      # npm postinstall copy would be downloaded and never used.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Package
        run: npm run package -- ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.zip
          if-no-files-found: error

  publish:
    needs: build
    # A manual run builds only: there is no tag to release against.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --draft \
            --notes "Builds are unsigned. macOS needs Gatekeeper approved under Privacy and Security, and Windows shows a SmartScreen warning. Review and edit these notes before publishing."
